# The Binder image. repo2docker's runtime.txt knows Python versions up to
# 3.14, and these workshops need 3.15, the release the profiler ships in,
# so the interpreter comes from conda-forge through this file instead;
# with an environment.yml present, repo2docker ignores runtime.txt and a
# top-level requirements.txt, so everything else is installed with pip
# from the locked runtime set that `just requirements` exports beside
# this file. The pin is the minor version alone so that the 3.15.0 final
# is picked up when conda-forge has it; until then it resolves to the
# latest release candidate, which is also what the workshops are checked
# against. A workshop's own environment is built from this interpreter,
# so the profiler and the program it profiles are the same Python, which
# the profiler requires.
name: tachyon-workshops
channels:
  - conda-forge
dependencies:
  - python=3.15
  - pip
  - pip:
      - -r requirements.txt
