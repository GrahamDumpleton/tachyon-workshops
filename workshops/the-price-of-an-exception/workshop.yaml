apiVersion: jupyterlab-workshop/v1alpha1
name: the-price-of-an-exception
title: The price of an exception
version: 0.1.0
description: Measure the time a program spends under an exception with Tachyon's exception mode, on a date parser that tries one format after another. What the mode counts, why raising is cheap and the handler is not, and the profile before and after the fix.
authors: [Graham Dumpleton]
homepage: https://github.com/GrahamDumpleton/tachyon-workshops/tree/main/workshops/the-price-of-an-exception
issues: https://github.com/GrahamDumpleton/tachyon-workshops/issues
tags: [python, tachyon, profiling, exceptions]
duration: 15m
platforms: [linux]
capabilities:
  - terminal
  - write-files
  - kernel-exec
  - install-packages
# The environment installs nothing; it is declared so that `python` in
# the terminal and behind the checks is the Python 3.15 that has the
# profiler, and the same interpreter as the program it profiles.
environment:
  requirements: requirements.txt
  kernel: workshop-the-price-of-an-exception
env:
  PAGER: cat
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
instructions: { side: right, width: 0.3 }
layout: dates
layouts:
  dates:
    main:
      areas:
        - { tabs: ["file:gazette/dates.py"] }
        - { size: 0.5, tabs: ["terminal:shell"] }
gating: soft
finish: |
  You have measured the time a program spends under an exception.
  Exception mode keeps the samples taken while an exception is on its
  way up the stack or an `except` block is running, and for the date
  parser that was about half of the run, nearly all of it in the
  handlers, where the second and third attempts were made. Raising
  was never the cost. The cost was that the path written for the
  unusual case was the one most of the data took, and a test of the
  text before parsing took it away.

  Next in these workshops is **Following the awaits**
  (`following-the-awaits`), which profiles a program written with
  `asyncio`, where the stack the profiler sees is the event loop's
  and the one you want is the task's.

  The "Exception mode" section of the
  [profiling.sampling documentation](https://docs.python.org/3.15/library/profiling.sampling.html)
  says exactly which code the mode captures.
pages:
  - pages/01-welcome.md
  - pages/02-where-the-time-goes.md
  - pages/03-under-an-exception.md
  - pages/04-the-fix.md
  - pages/05-finish.md
